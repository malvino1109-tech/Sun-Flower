<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%" class="marigold-artwork" aria-label="Ilustrasi Bunga Marigold">
  <defs>
    <radialGradient id="mg-petal-orange" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#D84315" />
    </radialGradient>
    <radialGradient id="mg-petal-yellow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="55%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#F57C00" />
    </radialGradient>
    <radialGradient id="mg-petal-core" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
    <linearGradient id="mg-stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E7036" />
      <stop offset="50%" stop-color="#789B59" />
      <stop offset="100%" stop-color="#315C3A" />
    </linearGradient>
    <filter id="mg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F28C28" flood-opacity="0.22" />
    </filter>
    <style>
      @keyframes mgBloom {
        0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
        60% { transform: scale(1.08) rotate(4deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes mgStem {
        0% { transform: scaleY(0); opacity: 0; }
        100% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes mgSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3.2deg); }
      }
      .bloom-target {
        transform-origin: 150px 145px;
        animation: mgBloom 1.3s cubic-bezier(0.16, 1.25, 0.3, 1) forwards;
      }
      .stem-target {
        transform-origin: 150px 380px;
        animation: mgStem 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .sway-leaves {
        animation: mgSway 6.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bloom-target, .stem-target, .sway-leaves { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Growing Stem & Calyx -->
  <g class="stem-target" style="transform-origin: 150px 380px;">
    <!-- Main Stem -->
    <path d="M 150 380 Q 152 270 150 170" fill="none" stroke="url(#mg-stem-grad)" stroke-width="11" stroke-linecap="round" />
    
    <!-- Calyx under flower -->
    <path d="M 135 174 C 135 195 165 195 165 174 Z" fill="#4E7036" stroke="#315C3A" stroke-width="1.5" />
    <path d="M 130 178 L 136 165 L 142 180 L 150 162 L 158 180 L 164 165 L 170 178" fill="none" stroke="#789B59" stroke-width="2" stroke-linecap="round" />

    <!-- Foliage / Pinnate Leaves -->
    <g class="sway-leaves" style="transform-origin: 150px 300px;">
      <!-- Left Pinnate Branch -->
      <path d="M 150 300 Q 110 290 80 270" fill="none" stroke="#558B2F" stroke-width="3" />
      <ellipse cx="82" cy="270" rx="9" ry="5" fill="#789B59" transform="rotate(-25 82 270)" />
      <ellipse cx="100" cy="275" rx="8" ry="4.5" fill="#789B59" transform="rotate(-30 100 275)" />
      <ellipse cx="120" cy="285" rx="8" ry="4.5" fill="#789B59" transform="rotate(-35 120 285)" />
      <ellipse cx="106" cy="295" rx="7" ry="4" fill="#689F38" transform="rotate(35 106 295)" />
      <ellipse cx="126" cy="302" rx="7" ry="4" fill="#689F38" transform="rotate(30 126 302)" />
    </g>

    <g class="sway-leaves" style="transform-origin: 150px 240px; animation-delay: -2s;">
      <!-- Right Pinnate Branch -->
      <path d="M 150 240 Q 190 230 220 205" fill="none" stroke="#558B2F" stroke-width="3" />
      <ellipse cx="220" cy="205" rx="9" ry="5" fill="#789B59" transform="rotate(25 220 205)" />
      <ellipse cx="200" cy="212" rx="8" ry="4.5" fill="#789B59" transform="rotate(30 200 212)" />
      <ellipse cx="180" cy="222" rx="8" ry="4.5" fill="#789B59" transform="rotate(35 180 222)" />
      <ellipse cx="194" cy="232" rx="7" ry="4" fill="#689F38" transform="rotate(-35 194 232)" />
      <ellipse cx="174" cy="238" rx="7" ry="4" fill="#689F38" transform="rotate(-30 174 238)" />
    </g>
  </g>

  <!-- Marigold Blooming Head Component -->
  <g class="bloom-target hover-glow" style="transform-origin: 150px 145px; cursor: pointer;" filter="url(#mg-glow)">
    
    <!-- Layer 1: Base Ruffled Orange Petals (Outer full circle) -->
    <g class="mg-layer-outer">
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(30 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(60 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(90 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(120 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(150 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(180 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(210 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(240 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(270 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(300 150 145)" />
      <path d="M 150 145 Q 128 85 150 55 Q 172 85 150 145" fill="url(#mg-petal-orange)" transform="rotate(330 150 145)" />
    </g>

    <!-- Layer 2: Intermediate Yellow-Gold Petals (Offset) -->
    <g class="mg-layer-mid" transform="scale(0.86) translate(24.4 23.6)">
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(15 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(45 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(75 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(105 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(135 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(165 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(195 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(225 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(255 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(285 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(315 150 145)" />
      <path d="M 150 145 Q 132 90 150 65 Q 168 90 150 145" fill="url(#mg-petal-yellow)" transform="rotate(345 150 145)" />
    </g>

    <!-- Layer 3: Dense Ruffled Crown (Tight Core) -->
    <g class="mg-layer-core" transform="scale(0.68) translate(70.5 68.2)">
      <circle cx="150" cy="145" r="45" fill="url(#mg-petal-core)" />
      <path d="M 140 115 Q 150 100 160 115 Q 150 130 140 115" fill="#FFE082" />
      <path d="M 120 135 Q 105 145 120 155 Q 135 145 120 135" fill="#FFCA28" />
      <path d="M 160 135 Q 145 145 160 155 Q 175 145 160 135" fill="#FFCA28" />
      <path d="M 140 165 Q 150 150 160 165 Q 150 180 140 165" fill="#FFE082" />
      <circle cx="150" cy="145" r="14" fill="#FF8F00" />
      <circle cx="150" cy="145" r="6" fill="#FFF8E7" opacity="0.8" />
    </g>
  </g>
</svg>
