<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" class="hamper-artwork" aria-label="Ilustrasi Hampers Tanaman">
  <defs>
    <linearGradient id="basket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C39E" />
      <stop offset="100%" stop-color="#C59B70" />
    </linearGradient>
    <linearGradient id="pot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97746" />
      <stop offset="50%" stop-color="#F28C5E" />
      <stop offset="100%" stop-color="#B85D30" />
    </linearGradient>
    <linearGradient id="kraft-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8" />
      <stop offset="100%" stop-color="#A1887F" />
    </linearGradient>
    <filter id="hamper-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#795548" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#hamper-shadow)">
    <!-- Base Shadow Mound -->
    <ellipse cx="250" cy="385" rx="200" ry="24" fill="#795548" opacity="0.16" />

    <!-- Woven Basket Hamper Container (Back Rim) -->
    <ellipse cx="250" cy="240" rx="190" ry="45" fill="#A88258" />

    <!-- 1. Media Tanam (Bag of soil & compost) - Back Left -->
    <g class="hamper-soil-bag" transform="translate(90, 130) rotate(-6)">
      <!-- Bag Body -->
      <path d="M 10 30 C 5 15 20 0 45 0 L 85 0 C 110 0 125 15 120 30 L 110 140 C 105 155 90 160 65 160 C 40 160 25 155 20 140 Z" fill="url(#kraft-grad)" stroke="#8D6E63" stroke-width="2" />
      <!-- Stitch lines -->
      <line x1="25" y1="18" x2="105" y2="18" stroke="#5D4037" stroke-width="2" stroke-dasharray="4, 3" />
      <!-- Label -->
      <rect x="32" y="55" width="66" height="50" rx="6" fill="#FFFDF9" stroke="#BCAAA4" stroke-width="1.5" />
      <text x="65" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#5D4037" text-anchor="middle">MEDIA</text>
      <text x="65" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#789B59" text-anchor="middle">TANAM</text>
      <!-- Little sprout on label -->
      <path d="M 65 64 Q 61 56 65 52 Q 69 56 65 64" fill="#789B59" />
    </g>

    <!-- 2. Pot Bunga (Center back) -->
    <g class="hamper-pot" transform="translate(195, 120)">
      <!-- Soil inside pot -->
      <ellipse cx="55" cy="48" rx="46" ry="14" fill="#4E342E" />
      <!-- Tiny green seedling emerging from pot -->
      <path d="M 55 46 Q 54 28 55 18" fill="none" stroke="#789B59" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="48" cy="18" rx="7" ry="4" fill="#789B59" transform="rotate(-25 48 18)" />
      <ellipse cx="62" cy="18" rx="7" ry="4" fill="#789B59" transform="rotate(25 62 18)" />
      <!-- Pot Rim -->
      <path d="M 5 44 C 5 36 25 32 55 32 C 85 32 105 36 105 44 C 105 52 85 56 55 56 C 25 56 5 52 5 44 Z" fill="#E27341" stroke="#A9481E" stroke-width="1.5" />
      <!-- Pot Tapered Body -->
      <path d="M 12 48 L 22 135 C 23 145 40 150 55 150 C 70 150 87 145 88 135 L 98 48" fill="url(#pot-grad)" stroke="#A9481E" stroke-width="1.5" />
      <!-- Pot decorative white botanical ring -->
      <path d="M 20 80 Q 55 90 90 80" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- 3. Benih (Seed Packets) - Front Left / Center -->
    <!-- Sunflower Seeds Packet -->
    <g class="hamper-seed-sf" transform="translate(125, 205) rotate(-14)">
      <rect x="0" y="0" width="60" height="85" rx="6" fill="#FFF8E7" stroke="#FFD447" stroke-width="2.5" />
      <rect x="6" y="6" width="48" height="40" rx="4" fill="#FFF176" opacity="0.3" />
      <!-- Mini sunflower drawing on packet -->
      <circle cx="30" cy="26" r="10" fill="#FFD447" />
      <circle cx="30" cy="26" r="5" fill="#5D4037" />
      <text x="30" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#3E2723" text-anchor="middle">BENIH</text>
      <text x="30" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" fill="#E65100" text-anchor="middle">MATAHARI</text>
    </g>

    <!-- Marigold Seeds Packet -->
    <g class="hamper-seed-mg" transform="translate(170, 215) rotate(8)">
      <rect x="0" y="0" width="58" height="82" rx="6" fill="#FFF8E7" stroke="#F28C28" stroke-width="2.5" />
      <rect x="6" y="6" width="46" height="38" rx="4" fill="#FFE0B2" opacity="0.4" />
      <!-- Mini marigold drawing on packet -->
      <circle cx="29" cy="25" r="9" fill="#F28C28" />
      <circle cx="29" cy="25" r="5" fill="#FFA726" />
      <text x="29" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#3E2723" text-anchor="middle">BENIH</text>
      <text x="29" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="600" fill="#D84315" text-anchor="middle">MARIGOLD</text>
    </g>

    <!-- 4. Kartu Petunjuk (Instruction Card) - Right side -->
    <g class="hamper-card" transform="translate(305, 145) rotate(12)">
      <!-- Card Paper -->
      <rect x="0" y="0" width="105" height="135" rx="8" fill="#FFFDF9" stroke="#EFE4CC" stroke-width="2" />
      <!-- Decorative Green Ribbon at top -->
      <path d="M 52 -10 L 52 14" stroke="#789B59" stroke-width="12" stroke-linecap="round" />
      <circle cx="52" cy="14" r="5" fill="#315C3A" />
      <!-- Card Content lines -->
      <text x="52" y="38" font-family="'Fraunces', serif" font-size="9" font-weight="700" fill="#315C3A" text-anchor="middle">Petunjuk Tanam</text>
      <line x1="22" y1="46" x2="82" y2="46" stroke="#E0D2B8" stroke-width="1.5" />
      <line x1="18" y1="60" x2="86" y2="60" stroke="#BCAAA4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="18" y1="74" x2="78" y2="74" stroke="#BCAAA4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="18" y1="88" x2="84" y2="88" stroke="#BCAAA4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="18" y1="102" x2="68" y2="102" stroke="#BCAAA4" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <!-- Tiny Flower Stamp on bottom corner -->
      <circle cx="84" cy="116" r="8" fill="#FFD447" opacity="0.8" />
      <circle cx="84" cy="116" r="3.5" fill="#795548" />
    </g>

    <!-- Woven Basket Hamper Container (Front Body) -->
    <path d="M 60 240 C 60 360 120 375 250 375 C 380 375 440 360 440 240 Z" fill="url(#basket-grad)" stroke="#B38656" stroke-width="2.5" />
    
    <!-- Basket Weave Texture Lines -->
    <path d="M 80 260 Q 250 280 420 260" fill="none" stroke="#C59B70" stroke-width="3" opacity="0.6" />
    <path d="M 95 295 Q 250 315 405 295" fill="none" stroke="#C59B70" stroke-width="3" opacity="0.6" />
    <path d="M 120 330 Q 250 348 380 330" fill="none" stroke="#C59B70" stroke-width="3" opacity="0.6" />
    <line x1="150" y1="250" x2="165" y2="360" stroke="#8D6E63" stroke-width="1.5" opacity="0.4" />
    <line x1="210" y1="255" x2="215" y2="370" stroke="#8D6E63" stroke-width="1.5" opacity="0.4" />
    <line x1="290" y1="255" x2="285" y2="370" stroke="#8D6E63" stroke-width="1.5" opacity="0.4" />
    <line x1="350" y1="250" x2="335" y2="360" stroke="#8D6E63" stroke-width="1.5" opacity="0.4" />

    <!-- Basket Rim Ribbon Accent -->
    <ellipse cx="250" cy="240" rx="190" ry="12" fill="none" stroke="#789B59" stroke-width="6" />
    <!-- Ribbon Bow in Front Center -->
    <g transform="translate(250, 240)">
      <path d="M 0 0 C -25 -18 -45 5 -12 12 Z" fill="#789B59" />
      <path d="M 0 0 C 25 -18 45 5 12 12 Z" fill="#789B59" />
      <circle cx="0" cy="2" r="6" fill="#315C3A" />
      <path d="M -2 6 Q -12 24 -18 36" fill="none" stroke="#789B59" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 2 6 Q 12 24 18 36" fill="none" stroke="#789B59" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
