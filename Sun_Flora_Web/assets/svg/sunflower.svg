<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%" class="sunflower-artwork" aria-label="Ilustrasi Bunga Matahari Mini">
  <defs>
    <radialGradient id="sf-center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E342E" />
      <stop offset="65%" stop-color="#5D4037" />
      <stop offset="90%" stop-color="#795548" />
      <stop offset="100%" stop-color="#8D6E63" />
    </radialGradient>
    <radialGradient id="sf-petal-grad-1" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="45%" stop-color="#FFD447" />
      <stop offset="100%" stop-color="#F28C28" />
    </radialGradient>
    <radialGradient id="sf-petal-grad-2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFEE58" />
      <stop offset="60%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FFA000" />
    </radialGradient>
    <linearGradient id="sf-stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#558B2F" />
      <stop offset="50%" stop-color="#789B59" />
      <stop offset="100%" stop-color="#315C3A" />
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F28C28" flood-opacity="0.18" />
    </filter>
    <style>
      @keyframes sfBloom {
        0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
        60% { transform: scale(1.08) rotate(4deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes sfStem {
        0% { transform: scaleY(0); opacity: 0; }
        100% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes sfSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3.2deg); }
      }
      .bloom-target {
        transform-origin: 150px 150px;
        animation: sfBloom 1.3s cubic-bezier(0.16, 1.25, 0.3, 1) forwards;
      }
      .stem-target {
        transform-origin: 150px 380px;
        animation: sfStem 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .sway-leaves {
        animation: sfSway 6.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bloom-target, .stem-target, .sway-leaves { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Growing Stem -->
  <g class="stem-target" style="transform-origin: 150px 380px;">
    <!-- Main Stem -->
    <path d="M 150 380 Q 148 280 150 160" fill="none" stroke="url(#sf-stem-grad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Leaves -->
    <g class="sway-leaves" style="transform-origin: 150px 290px;">
      <!-- Left Leaf -->
      <path d="M 148 290 C 110 280 80 250 65 220 C 95 225 125 255 148 275" fill="#789B59" stroke="#315C3A" stroke-width="2" />
      <path d="M 148 280 Q 115 255 75 225" fill="none" stroke="#5E8342" stroke-width="1.5" />
    </g>

    <g class="sway-leaves" style="transform-origin: 150px 230px; animation-delay: -1.8s;">
      <!-- Right Leaf -->
      <path d="M 150 230 C 190 220 220 190 235 160 C 205 165 175 195 150 215" fill="#789B59" stroke="#315C3A" stroke-width="2" />
      <path d="M 150 220 Q 185 195 225 165" fill="none" stroke="#5E8342" stroke-width="1.5" />
    </g>
  </g>

  <!-- Sunflower Head Blooming Component -->
  <g class="bloom-target hover-glow" style="transform-origin: 150px 150px; cursor: pointer;" filter="url(#sf-glow)">
    
    <!-- Outer Petals Layer (16 petals) -->
    <g class="sf-petals-outer">
      <!-- 0 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" />
      <!-- 22.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(22.5 150 150)" />
      <!-- 45 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(45 150 150)" />
      <!-- 67.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(67.5 150 150)" />
      <!-- 90 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(90 150 150)" />
      <!-- 112.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(112.5 150 150)" />
      <!-- 135 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(135 150 150)" />
      <!-- 157.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(157.5 150 150)" />
      <!-- 180 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(180 150 150)" />
      <!-- 202.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(202.5 150 150)" />
      <!-- 225 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(225 150 150)" />
      <!-- 247.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(247.5 150 150)" />
      <!-- 270 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(270 150 150)" />
      <!-- 292.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(292.5 150 150)" />
      <!-- 315 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(315 150 150)" />
      <!-- 337.5 deg -->
      <path d="M 150 150 C 138 90 142 50 150 25 C 158 50 162 90 150 150" fill="url(#sf-petal-grad-1)" transform="rotate(337.5 150 150)" />
    </g>

    <!-- Inner Petals Layer (Offset by 11.25 deg for dense bloom) -->
    <g class="sf-petals-inner" transform="scale(0.88) translate(20.4 20.4)">
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(11.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(33.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(56.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(78.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(101.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(123.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(146.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(168.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(191.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(213.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(236.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(258.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(281.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(303.75 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(326.25 150 150)" />
      <path d="M 150 150 C 140 100 144 65 150 40 C 156 65 160 100 150 150" fill="url(#sf-petal-grad-2)" transform="rotate(348.75 150 150)" />
    </g>

    <!-- Warm Brown Seed Center Disk -->
    <circle cx="150" cy="150" r="54" fill="url(#sf-center-grad)" stroke="#4E342E" stroke-width="2" />

    <!-- Organic Seed Spiral Pattern Textures -->
    <g fill="#A1887F" opacity="0.6">
      <circle cx="150" cy="150" r="4" fill="#FFE082" />
      <circle cx="140" cy="144" r="2.8" />
      <circle cx="160" cy="156" r="2.8" />
      <circle cx="156" cy="138" r="2.8" />
      <circle cx="144" cy="162" r="2.8" />
      <circle cx="132" cy="150" r="3" />
      <circle cx="168" cy="150" r="3" />
      <circle cx="150" cy="132" r="3" />
      <circle cx="150" cy="168" r="3" />
      <circle cx="135" cy="135" r="2.6" />
      <circle cx="165" cy="165" r="2.6" />
      <circle cx="165" cy="135" r="2.6" />
      <circle cx="135" cy="165" r="2.6" />
      <circle cx="124" cy="142" r="2.4" />
      <circle cx="176" cy="158" r="2.4" />
      <circle cx="158" cy="124" r="2.4" />
      <circle cx="142" cy="176" r="2.4" />
      <circle cx="122" cy="158" r="2.4" />
      <circle cx="178" cy="142" r="2.4" />
      <circle cx="142" cy="122" r="2.4" />
      <circle cx="158" cy="178" r="2.4" />
    </g>

    <!-- Center Rim Detail -->
    <circle cx="150" cy="150" r="53" fill="none" stroke="#D7CCC8" stroke-width="1.5" stroke-dasharray="3, 4" opacity="0.45" />
  </g>
</svg>
